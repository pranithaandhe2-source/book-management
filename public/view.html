<!DOCTYPE html>
<html>
<head><title>View Books</title><link rel="stylesheet" href="style.css"></head>
<body>
<h2>Book List</h2>
<table id="table" border="1">
<tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Price</th><th>Stock</th></tr>
</table>
<script>
fetch('/books').then(r=>r.json()).then(data=>{
let t=document.getElementById('table');
data.forEach(b=>{
t.innerHTML += `<tr><td>${b.book_id}</td><td>${b.title}</td><td>${b.author}</td><td>${b.category}</td><td>${b.price}</td><td>${b.stock}</td></tr>`;
});
});
</script>
</body>
</html>
